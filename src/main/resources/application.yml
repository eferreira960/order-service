mongodbDatabase: orders
mongodbUri: "mongodb://127.0.0.1:27017"
apiPort: 9898

server:
  port: ${apiPort}

spring:
  main:
    web-application-type: reactive
  codec:
    max-in-memory-size: 16MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: hacom-orders
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

otel:
  traces:
    exporter: otlp
  exporter:
    otlp:
      endpoint: http://localhost:4318/v1/traces
      protocol: http/protobuf
  service:
    name: hacom-orders-service

grpc:
  server:
    port: 9090
    enable-keepalive: true
    keepalive-time: 30s
    keepalive-timeout: 5s
    security:
      enabled: false 
      # certificate-chain: classpath:certs/server.crt
      # private-key: classpath:certs/server.pem
      # trust-cert-collection: classpath:certs/ca.crt
    # mTLS client-auth requires: client-auth needed
    # client-auth: need

# SMPP configuration
smpp:
  host: localhost
  port: 2775
  system-id: smppclient
  password: password
  source-ton: 5
  source-npi: 0
  source-address: HACOM
  dest-ton: 1
  dest-npi: 1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  config: classpath:log4j2.yml

resilience4j:
  ratelimiter:
    configs:
      default:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 100ms
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2

---
spring:
  config:
    activate:
      on-profile: docker

mongodbDatabase: ${mongodbDatabase:exampleDb}
mongodbUri: ${mongodbUri:mongodb://mongodb:27017}
apiPort: ${apiPort:9898}

grpc:
  server:
    port: 9090

smpp:
  host: ${smpp_host:localhost}
  port: ${smpp_port:2775}
  system-id: ${smpp_system_id:smppclient}
  password: ${smpp_password:password}

server:
  port: ${apiPort:9898}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_ENDPOINT:http://otel-collector:4318/v1/traces}